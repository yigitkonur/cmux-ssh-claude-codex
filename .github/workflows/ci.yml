name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint bin/cc-ssh and lib/*.sh
        run: |
          shellcheck -x bin/cc-ssh lib/*.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Run tests
        run: make test
